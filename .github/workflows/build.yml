name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's Ubuntu runners already ship the Android SDK with licences accepted.
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
